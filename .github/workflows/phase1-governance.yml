name: Phase 1 closure governance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the exact Phase 1 Node runtime without dependency caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install the exact Phase 1 Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.13.12

      - name: Activate the exact pnpm runtime
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install the exact Rust toolchain and WASM target
        shell: pwsh
        run: >-
          rustup toolchain install 1.94.0
          --profile minimal
          --component clippy,rustfmt
          --target wasm32-unknown-unknown
          --no-self-update

      - name: Report runner and runtime evidence
        shell: pwsh
        run: |
          Write-Output "runner-image=$env:ImageOS/$env:ImageVersion"
          node --version
          pnpm --version
          python --version
          rustup run 1.94.0 rustc --version
          rustup run 1.94.0 cargo --version

      - name: Install the frozen dependency graph without lifecycle scripts
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run the complete Phase 1 closure gate
        shell: pwsh
        run: pnpm gate:closure
