[workspace]
members = [
    "crates/foundation-wasm",
    "crates/plc-commissioning",
    "crates/plc-core",
    "crates/plc-engineering-wasm",
    "crates/plc-hardware",
    "crates/plc-program",
    "crates/plc-runtime",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
