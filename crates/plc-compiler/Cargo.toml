[package]
name = "plc-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "UNLICENSED"
description = "Capability-free deterministic PLC compiler and initial SCL frontend"

[lib]
path = "src/lib.rs"

[dependencies]
plc-hardware = { path = "../plc-hardware" }
plc-program = { path = "../plc-program" }
plc-runtime = { path = "../plc-runtime" }

[dev-dependencies]
plc-lad = { path = "../plc-lad" }
plc-language-tools = { path = "../plc-language-tools" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
