[package]
name = "plc-lad"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "UNLICENSED"
description = "Capability-free semantic Ladder Diagram graph and shared-IR lowering"

[lib]
path = "src/lib.rs"

[dependencies]
plc-program = { path = "../plc-program" }
plc-compiler = { path = "../plc-compiler" }
plc-types = { path = "../plc-types" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
