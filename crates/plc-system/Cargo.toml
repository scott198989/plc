[package]
name = "plc-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "UNLICENSED"
description = "Canonical project projection and integrated Phase 2 PLC engineering facade"

[lib]
path = "src/lib.rs"

[dependencies]
plc-core = { path = "../plc-core" }
plc-hardware = { path = "../plc-hardware" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
