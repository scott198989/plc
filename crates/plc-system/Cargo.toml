[package]
name = "plc-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "UNLICENSED"
description = "Canonical project projection and integrated Phase 2 PLC engineering facade"

[lib]
path = "src/lib.rs"

[dependencies]
plc-commissioning = { path = "../plc-commissioning" }
plc-compiler = { path = "../plc-compiler" }
plc-core = { path = "../plc-core" }
plc-hardware = { path = "../plc-hardware" }
plc-lad = { path = "../plc-lad" }
plc-language-tools = { path = "../plc-language-tools" }
plc-observability = { path = "../plc-observability" }
plc-program = { path = "../plc-program" }
plc-runtime = { path = "../plc-runtime" }
plc-types = { path = "../plc-types" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
